<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Emerald gradient background circle -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- D letter bold white -->
  <text x="5" y="24" font-family="Arial Black, Arial" font-weight="900" font-size="22" fill="white" letter-spacing="-1">D</text>
  <!-- IQ small superscript -->
  <text x="20" y="16" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.90)">IQ</text>
</svg>
